[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-master"
version = "0.1.0"
description = "Python Master - Roman Urdu learning app for Python + AI/ML basics"
readme = "README.md"
authors = [
    { name = "Developer" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "streamlit>=1.30.0",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "scikit-learn>=1.0.0",
    "requests>=2.25.0",
]
requires-python = ">=3.8"

[project.scripts]
python-master = "python_master.cli:main"
